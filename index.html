<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Machine Log & Finance Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-+M0h2mqv+1WYf+GO6zkRgZNpmjDoE7YQDdyCjTiMQuuLHfoalvVYLRNvKcJsteUmsDWUpAJZciV06P88GJEHVw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" integrity="sha512-0E7dnwKs6vTmyaKOA1NVuMcZpNigC4b9TtT5ojVu2YnkzmxOKSzPmcZBrjtGTl6yN7a5jD3vC9DP+0mD3ex4sw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --primary: #2563eb;
      --primary-strong: #1d4ed8;
      --border: #e5e7eb;
      --success: #16a34a;
      --danger: #dc2626;
    }
    :root.dark {
      --bg: #0b1221;
      --surface: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #60a5fa;
      --primary-strong: #3b82f6;
      --border: #1f2937;
      --success: #22c55e;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      border-bottom: 1px solid var(--border);
      padding: 1rem clamp(1rem, 2vw, 2rem);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      justify-content: space-between;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 1.6vw, 1.8rem);
      letter-spacing: -0.02em;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: clamp(1rem, 2vw, 2rem);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    button, select, input, textarea {
      font-family: inherit;
    }
    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 0.6rem 0.9rem;
      border-radius: 0.6rem;
      font-weight: 600;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }
    button.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary-strong);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.18);
    }
    button.primary:hover { background: var(--primary-strong); }
    button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    button.success { background: var(--success); color: #fff; border-color: var(--success); }
    button:hover { transform: translateY(-1px); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }
    .grid {
      display: grid;
      gap: 1rem;
    }
    .summary {
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.9rem;
      padding: 1rem;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    }
    .card h3 { margin: 0 0 0.25rem; font-size: 0.95rem; color: var(--muted); }
    .card strong { font-size: 1.3rem; }
    form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.9rem;
      padding: 1rem;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    }
    form .row { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    label { font-weight: 600; display: flex; flex-direction: column; gap: 0.35rem; color: var(--muted); }
    input, select, textarea {
      padding: 0.65rem 0.7rem;
      border-radius: 0.65rem;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 95%, transparent);
      color: var(--text);
    }
    textarea { resize: vertical; min-height: 80px; }
    .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { padding: 0.8rem; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-weight: 700; background: color-mix(in srgb, var(--surface) 94%, transparent); }
    tr:hover td { background: color-mix(in srgb, var(--primary) 6%, transparent); }
    .badge { padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; background: color-mix(in srgb, var(--primary) 18%, transparent); color: var(--primary-strong); }
    .filters {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.9rem;
      padding: 1rem;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    }
    .filters .grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); align-items: end; }
    .toast-area {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 20;
    }
    .toast {
      padding: 0.8rem 1rem;
      border-radius: 0.75rem;
      color: #fff;
      min-width: 220px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.2);
      animation: slideIn 160ms ease, fadeOut 200ms ease 3.6s forwards;
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px);} to { opacity:1; transform: translateY(0);} }
    @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px);} }
    .switch {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.35rem 0.6rem;
    }
    .switch input { display:none; }
    .switch span {
      width: 36px;
      height: 20px;
      background: var(--border);
      border-radius: 999px;
      position: relative;
      transition: background 150ms ease;
    }
    .switch span::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      top: 2px; left: 2px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 150ms ease;
    }
    .switch input:checked + span { background: var(--primary); }
    .switch input:checked + span::after { transform: translateX(16px); }
    .tag-input { display:flex; gap:0.35rem; flex-wrap:wrap; }
    .tag-input input { flex:1; min-width:140px; }
    .tag-pill { background: color-mix(in srgb, var(--primary) 20%, transparent); color: var(--primary-strong); padding: 0.25rem 0.55rem; border-radius: 999px; display:inline-flex; align-items:center; gap:0.35rem; }
    .tag-pill button { border:none; background:transparent; color:inherit; padding:0; font-size:0.9rem; }
    @media (max-width: 720px) {
      header { position: sticky; }
      table { min-width: 720px; }
    }
    @media print {
      header, .no-print { display: none !important; }
      body { background: #fff; color: #000; }
      .card, form, .filters { box-shadow: none; border: 1px solid #ddd; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Machine Log & Finance Tracker</h1>
    <div class="actions">
      <label class="switch" aria-label="Toggle dark mode">
        <input type="checkbox" id="modeToggle">
        <span aria-hidden="true"></span>
      </label>
      <button id="exampleBtn" class="success">Example Data</button>
      <button id="resetBtn" class="danger">Reset All Data</button>
    </div>
  </header>

  <div class="toast-area" aria-live="polite"></div>

  <main class="container">
    <section class="grid summary" aria-label="Summary cards">
      <div class="card"><h3>Total Income</h3><strong id="totalIncome">€0.00</strong></div>
      <div class="card"><h3>Total Diesel</h3><strong id="totalDiesel">€0.00</strong></div>
      <div class="card"><h3>Total Repairs</h3><strong id="totalRepairs">€0.00</strong></div>
      <div class="card"><h3>Total Profit</h3><strong id="totalProfit">€0.00</strong></div>
    </section>

    <section class="no-print" aria-label="Entry form" style="margin: 1.2rem 0;">
      <form id="entryForm">
        <div class="row">
          <label>Date
            <input type="date" name="date" required />
          </label>
          <label>Machine name
            <input type="text" name="machine" required placeholder="e.g., Excavator A" />
          </label>
          <label>Output
            <div class="controls">
              <input type="number" name="output" min="0" step="0.01" required placeholder="e.g., 8" />
              <select name="unit" aria-label="Output unit">
                <option value="hours">hours</option>
                <option value="units">units</option>
                <option value="km">km</option>
              </select>
            </div>
          </label>
          <label>Diesel expense
            <div class="controls">
              <input type="number" name="diesel" min="0" step="0.01" required placeholder="e.g., 120" />
              <select name="dieselCurrency" aria-label="Diesel currency">
                <option value="EUR">EUR</option>
                <option value="USD">USD</option>
                <option value="SAR">SAR</option>
                <option value="GBP">GBP</option>
              </select>
            </div>
          </label>
          <label>Income
            <div class="controls">
              <input type="number" name="income" min="0" step="0.01" required placeholder="e.g., 500" />
              <select name="incomeCurrency" aria-label="Income currency">
                <option value="EUR">EUR</option>
                <option value="USD">USD</option>
                <option value="SAR">SAR</option>
                <option value="GBP">GBP</option>
              </select>
            </div>
          </label>
          <label>Repair costs
            <div class="controls">
              <input type="number" name="repair" min="0" step="0.01" required placeholder="e.g., 50" />
              <select name="repairCurrency" aria-label="Repair currency">
                <option value="EUR">EUR</option>
                <option value="USD">USD</option>
                <option value="SAR">SAR</option>
                <option value="GBP">GBP</option>
              </select>
            </div>
          </label>
          <label>Repair tags (optional)
            <div class="tag-input">
              <input type="text" id="tagInput" placeholder="Add tag and press Enter" />
            </div>
            <div id="tagList" aria-live="polite"></div>
          </label>
          <label>Notes
            <textarea name="notes" placeholder="Additional notes"></textarea>
          </label>
        </div>
        <div class="controls" style="justify-content: flex-end; margin-top: 0.5rem;">
          <button type="button" id="cancelEdit" style="display:none;">Cancel edit</button>
          <button class="primary" type="submit" id="submitBtn">Add entry</button>
        </div>
      </form>
    </section>

    <section class="filters no-print" aria-label="Filters and exports">
      <div class="grid">
        <label>Search
          <input type="search" id="searchInput" placeholder="Search machine or notes" />
        </label>
        <label>Machine filter
          <select id="machineFilter">
            <option value="">All machines</option>
          </select>
        </label>
        <label>Start date
          <input type="date" id="startDate" />
        </label>
        <label>End date
          <input type="date" id="endDate" />
        </label>
        <label>Sort by date
          <select id="sortSelect">
            <option value="desc">Newest first</option>
            <option value="asc">Oldest first</option>
          </select>
        </label>
        <div class="controls" style="gap:0.4rem;">
          <button id="exportJson">Export JSON</button>
          <button id="importJson">Import JSON</button>
          <input type="file" id="fileInput" accept="application/json" style="display:none;" />
        </div>
        <div class="controls" style="gap:0.4rem;">
          <button id="exportCsv">Export CSV</button>
          <button id="exportDoc">Word download</button>
          <button id="exportPdf">PDF download</button>
          <button id="printBtn">Print</button>
        </div>
      </div>
    </section>

    <section aria-label="Entries" class="card" style="margin-top:1rem;">
      <div class="table-wrapper">
        <table aria-describedby="tableHelp">
          <caption id="tableHelp" style="text-align:left; padding:0.5rem 0; color: var(--muted);">Add, edit, and export machine logs. Sorted by date.</caption>
          <thead>
            <tr>
              <th>Date</th>
              <th>Machine</th>
              <th>Output</th>
              <th>Diesel</th>
              <th>Income</th>
              <th>Repairs</th>
              <th>Profit</th>
              <th>Notes</th>
              <th>Tags</th>
              <th class="no-print">Actions</th>
            </tr>
          </thead>
          <tbody id="entriesBody"></tbody>
        </table>
      </div>
    </section>

    <section aria-label="Monthly summary" class="card" style="margin-top:1rem;">
      <h2 style="margin:0 0 0.5rem;">Monthly summary</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Month</th>
              <th>Income</th>
              <th>Diesel</th>
              <th>Repairs</th>
              <th>Profit</th>
            </tr>
          </thead>
          <tbody id="monthlyBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const storageKey = 'machineLogs';
    const modeKey = 'machineLogs-mode';
    const toastArea = document.querySelector('.toast-area');
    const entryForm = document.getElementById('entryForm');
    const entriesBody = document.getElementById('entriesBody');
    const monthlyBody = document.getElementById('monthlyBody');
    const tagInput = document.getElementById('tagInput');
    const tagList = document.getElementById('tagList');
    const fileInput = document.getElementById('fileInput');
    const machineFilter = document.getElementById('machineFilter');
    const searchInput = document.getElementById('searchInput');
    const startDate = document.getElementById('startDate');
    const endDate = document.getElementById('endDate');
    const sortSelect = document.getElementById('sortSelect');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEditBtn = document.getElementById('cancelEdit');
    const modeToggle = document.getElementById('modeToggle');

    let entries = loadEntries();
    let currentTags = [];
    let editingId = null;

    function loadEntries() {
      try {
        const raw = localStorage.getItem(storageKey);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        console.error('Failed to load entries', e);
        return [];
      }
    }

    function saveEntries() {
      localStorage.setItem(storageKey, JSON.stringify(entries));
    }

    function formatMoneyMap(map) {
      if (!map || Object.keys(map).length === 0) return '€0.00';
      return Object.entries(map)
        .map(([cur, val]) => `${cur} ${val.toFixed(2)}`)
        .join(' · ');
    }

    function showToast(message, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = message;
      toastArea.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function clearForm() {
      entryForm.reset();
      currentTags = [];
      tagList.innerHTML = '';
      editingId = null;
      submitBtn.textContent = 'Add entry';
      cancelEditBtn.style.display = 'none';
    }

    function renderTags() {
      tagList.innerHTML = '';
      currentTags.forEach((tag, idx) => {
        const pill = document.createElement('span');
        pill.className = 'tag-pill';
        pill.textContent = tag;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-label', 'Remove tag');
        btn.textContent = '✕';
        btn.onclick = () => { currentTags.splice(idx, 1); renderTags(); };
        pill.appendChild(btn);
        tagList.appendChild(pill);
      });
    }

    tagInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && tagInput.value.trim()) {
        e.preventDefault();
        currentTags.push(tagInput.value.trim());
        tagInput.value = '';
        renderTags();
      }
    });

    entryForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = new FormData(entryForm);
      const date = data.get('date');
      const machine = data.get('machine').trim();
      const output = parseFloat(data.get('output'));
      const diesel = parseFloat(data.get('diesel'));
      const income = parseFloat(data.get('income'));
      const repair = parseFloat(data.get('repair'));
      if (!date || !machine || [output, diesel, income, repair].some((n) => isNaN(n) || n < 0)) {
        showToast('Please fill all required numeric fields with valid values.', 'error');
        return;
      }
      const entry = {
        id: editingId ?? crypto.randomUUID(),
        date,
        machine,
        output,
        unit: data.get('unit'),
        diesel,
        dieselCurrency: data.get('dieselCurrency'),
        income,
        incomeCurrency: data.get('incomeCurrency'),
        repair,
        repairCurrency: data.get('repairCurrency'),
        notes: data.get('notes')?.trim() || '',
        tags: [...currentTags]
      };
      if (editingId) {
        entries = entries.map((e) => (e.id === editingId ? entry : e));
        showToast('Entry updated');
      } else {
        entries.push(entry);
        showToast('Entry added');
      }
      saveEntries();
      clearForm();
      render();
    });

    cancelEditBtn.addEventListener('click', clearForm);

    function applyFilters(list) {
      const term = searchInput.value.toLowerCase();
      const start = startDate.value ? new Date(startDate.value) : null;
      const end = endDate.value ? new Date(endDate.value) : null;
      const machineVal = machineFilter.value;
      return list.filter((item) => {
        const d = new Date(item.date);
        if (start && d < start) return false;
        if (end && d > end) return false;
        if (machineVal && item.machine !== machineVal) return false;
        const noteText = (item.notes || '').toLowerCase();
        if (term && !(item.machine.toLowerCase().includes(term) || noteText.includes(term))) return false;
        return true;
      });
    }

    function sortEntries(list) {
      return [...list].sort((a, b) => {
        const diff = new Date(a.date) - new Date(b.date);
        return sortSelect.value === 'asc' ? diff : -diff;
      });
    }

    function aggregateByCurrency(list, key) {
      return list.reduce((acc, item) => {
        const currency = item[key + 'Currency'];
        const value = Number(item[key]) || 0;
        acc[currency] = (acc[currency] || 0) + value;
        return acc;
      }, {});
    }

    function renderSummary(filtered) {
      const incomeMap = aggregateByCurrency(filtered, 'income');
      const dieselMap = aggregateByCurrency(filtered, 'diesel');
      const repairMap = aggregateByCurrency(filtered, 'repair');
      const profitMap = {};
      filtered.forEach((item) => {
        const cur = item.incomeCurrency;
        const profitVal = (Number(item.income) || 0) - ((Number(item.diesel) || 0) + (Number(item.repair) || 0));
        profitMap[cur] = (profitMap[cur] || 0) + profitVal;
      });
      document.getElementById('totalIncome').textContent = formatMoneyMap(incomeMap);
      document.getElementById('totalDiesel').textContent = formatMoneyMap(dieselMap);
      document.getElementById('totalRepairs').textContent = formatMoneyMap(repairMap);
      document.getElementById('totalProfit').textContent = formatMoneyMap(profitMap);
    }

    function renderEntriesTable(list) {
      entriesBody.innerHTML = '';
      if (list.length === 0) {
        entriesBody.innerHTML = '<tr><td colspan="10" style="text-align:center; color: var(--muted);">No entries yet.</td></tr>';
        return;
      }
      list.forEach((item) => {
        const row = document.createElement('tr');
        const profit = (Number(item.income) || 0) - ((Number(item.diesel) || 0) + (Number(item.repair) || 0));
        row.innerHTML = `
          <td>${item.date}</td>
          <td>${item.machine}</td>
          <td>${item.output} ${item.unit}</td>
          <td>${item.dieselCurrency} ${item.diesel.toFixed(2)}</td>
          <td>${item.incomeCurrency} ${item.income.toFixed(2)}</td>
          <td>${item.repairCurrency} ${item.repair.toFixed(2)}</td>
          <td>${item.incomeCurrency} ${profit.toFixed(2)}</td>
          <td>${item.notes || ''}</td>
          <td>${item.tags?.map(t => `<span class="badge">${t}</span>`).join(' ') || ''}</td>
          <td class="no-print">
            <button aria-label="Edit entry" data-id="${item.id}" class="primary" style="padding:0.35rem 0.6rem;">Edit</button>
            <button aria-label="Delete entry" data-id="${item.id}" class="danger" style="padding:0.35rem 0.6rem;">Delete</button>
          </td>
        `;
        const [editBtn, deleteBtn] = row.querySelectorAll('button');
        editBtn.onclick = () => startEdit(item.id);
        deleteBtn.onclick = () => deleteEntry(item.id);
        entriesBody.appendChild(row);
      });
    }

    function renderMachineFilter() {
      const current = machineFilter.value;
      const machines = Array.from(new Set(entries.map((e) => e.machine))).sort();
      machineFilter.innerHTML = '<option value="">All machines</option>' + machines.map((m) => `<option value="${m}">${m}</option>`).join('');
      if (machines.includes(current)) machineFilter.value = current;
    }

    function renderMonthly(filtered) {
      const map = {};
      filtered.forEach((item) => {
        const date = new Date(item.date + 'T00:00:00');
        const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        const label = date.toLocaleString('en', { month: 'short', year: 'numeric' });
        if (!map[key]) map[key] = { label, items: [] };
        map[key].items.push(item);
      });
      monthlyBody.innerHTML = '';
      if (Object.keys(map).length === 0) {
        monthlyBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--muted);">No data yet.</td></tr>';
        return;
      }
      Object.entries(map).sort((a,b) => a[0].localeCompare(b[0])).forEach(([key, bucket]) => {
        const { label, items } = bucket;
        const incomeMap = aggregateByCurrency(items, 'income');
        const dieselMap = aggregateByCurrency(items, 'diesel');
        const repairMap = aggregateByCurrency(items, 'repair');
        const profitMap = {};
        items.forEach((it) => {
          const cur = it.incomeCurrency;
          const profitVal = (Number(it.income) || 0) - ((Number(it.diesel) || 0) + (Number(it.repair) || 0));
          profitMap[cur] = (profitMap[cur] || 0) + profitVal;
        });
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${label}</td>
          <td>${formatMoneyMap(incomeMap)}</td>
          <td>${formatMoneyMap(dieselMap)}</td>
          <td>${formatMoneyMap(repairMap)}</td>
          <td>${formatMoneyMap(profitMap)}</td>
        `;
        monthlyBody.appendChild(row);
      });
    }

    function render() {
      const filtered = applyFilters(entries);
      const sorted = sortEntries(filtered);
      renderSummary(filtered);
      renderEntriesTable(sorted);
      renderMonthly(filtered);
      renderMachineFilter();
    }

    function startEdit(id) {
      const item = entries.find((e) => e.id === id);
      if (!item) return;
      editingId = id;
      entryForm.date.value = item.date;
      entryForm.machine.value = item.machine;
      entryForm.output.value = item.output;
      entryForm.unit.value = item.unit;
      entryForm.diesel.value = item.diesel;
      entryForm.dieselCurrency.value = item.dieselCurrency;
      entryForm.income.value = item.income;
      entryForm.incomeCurrency.value = item.incomeCurrency;
      entryForm.repair.value = item.repair;
      entryForm.repairCurrency.value = item.repairCurrency;
      entryForm.notes.value = item.notes;
      currentTags = [...(item.tags || [])];
      renderTags();
      submitBtn.textContent = 'Save changes';
      cancelEditBtn.style.display = 'inline-flex';
      showToast('Edit mode enabled');
    }

    function deleteEntry(id) {
      const item = entries.find((e) => e.id === id);
      if (!item) return;
      const confirmed = confirm('Are you sure you want to delete this entry?');
      if (!confirmed) return;
      entries = entries.filter((e) => e.id !== id);
      saveEntries();
      render();
      showToast('Entry deleted');
      if (editingId === id) clearForm();
    }

    document.getElementById('exampleBtn').addEventListener('click', () => {
      const demo = [
        { date: '2024-11-02', machine: 'Excavator A', output: 8, unit: 'hours', diesel: 120, dieselCurrency: 'EUR', income: 520, incomeCurrency: 'EUR', repair: 40, repairCurrency: 'EUR', notes: 'Gravel site', tags: ['filters', 'oil'] },
        { date: '2024-11-05', machine: 'Bulldozer B', output: 14, unit: 'hours', diesel: 180, dieselCurrency: 'EUR', income: 760, incomeCurrency: 'EUR', repair: 0, repairCurrency: 'EUR', notes: 'Road prep', tags: [] },
        { date: '2024-12-12', machine: 'Excavator A', output: 10, unit: 'hours', diesel: 140, dieselCurrency: 'EUR', income: 650, incomeCurrency: 'EUR', repair: 90, repairCurrency: 'EUR', notes: 'Hydraulic hose', tags: ['hose'] },
        { date: '2025-01-04', machine: 'Crane C', output: 6, unit: 'hours', diesel: 95, dieselCurrency: 'USD', income: 580, incomeCurrency: 'USD', repair: 50, repairCurrency: 'USD', notes: 'Night shift', tags: [] },
        { date: '2025-02-10', machine: 'Loader D', output: 400, unit: 'units', diesel: 210, dieselCurrency: 'SAR', income: 1200, incomeCurrency: 'SAR', repair: 30, repairCurrency: 'SAR', notes: 'Aggregate', tags: ['tires'] },
      ];
      entries = demo.map((d) => ({ id: crypto.randomUUID(), ...d }));
      saveEntries();
      render();
      showToast('Example data added');
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      const first = confirm('This will remove all stored data. Continue?');
      if (!first) return;
      const second = confirm('Are you absolutely sure? This cannot be undone.');
      if (!second) return;
      entries = [];
      saveEntries();
      clearForm();
      render();
      showToast('All data cleared');
    });

    machineFilter.addEventListener('change', render);
    searchInput.addEventListener('input', render);
    startDate.addEventListener('change', render);
    endDate.addEventListener('change', render);
    sortSelect.addEventListener('change', render);

    document.getElementById('exportJson').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'machine-log-backup.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('importJson').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if (!Array.isArray(data)) throw new Error('Invalid format');
          data.forEach((item) => { if (!item.id) item.id = crypto.randomUUID(); });
          entries = data;
          saveEntries();
          render();
          showToast('Import successful');
        } catch (err) {
          showToast('Import failed: ' + err.message, 'error');
        }
      };
      reader.readAsText(file);
      fileInput.value = '';
    });

    document.getElementById('exportCsv').addEventListener('click', () => {
      const header = ['Date','Machine','Output','Unit','Diesel','Diesel Currency','Income','Income Currency','Repair','Repair Currency','Profit','Notes','Tags'];
      const rows = entries.map((e) => {
        const profit = (Number(e.income)||0) - ((Number(e.diesel)||0)+(Number(e.repair)||0));
        return [e.date,e.machine,e.output,e.unit,e.diesel,e.dieselCurrency,e.income,e.incomeCurrency,e.repair,e.repairCurrency,profit,e.notes,(e.tags||[]).join('|')];
      });
      const csv = [header, ...rows].map((r) => r.map((cell) => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'machine-log.csv';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('exportDoc').addEventListener('click', () => {
      const content = document.querySelector('main').innerHTML;
      const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Machine Log Report</title></head><body>${content}</body></html>`;
      const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'machine-log.doc';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('exportPdf').addEventListener('click', () => {
      if (!window.jspdf || !window.jspdf.jsPDF || !window.jspdf.jsPDF.API.autoTable) {
        showToast('PDF library not loaded', 'error');
        return;
      }
      const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
      doc.setFontSize(14);
      doc.text('Machine Log & Finance Tracker', 40, 40);
      doc.setFontSize(10);
      const headers = ['Date','Machine','Output','Diesel','Income','Repair','Profit'];
      const rows = applyFilters(entries).map((e) => {
        const profit = (Number(e.income)||0) - ((Number(e.diesel)||0)+(Number(e.repair)||0));
        return [e.date, e.machine, `${e.output} ${e.unit}`, `${e.dieselCurrency} ${e.diesel.toFixed(2)}`, `${e.incomeCurrency} ${e.income.toFixed(2)}`, `${e.repairCurrency} ${e.repair.toFixed(2)}`, `${e.incomeCurrency} ${profit.toFixed(2)}`];
      });
      const startY = 60;
      doc.autoTable({ head: [headers], body: rows, startY, styles: { fontSize: 8 } });
      doc.save('machine-log.pdf');
    });

    document.getElementById('printBtn').addEventListener('click', () => window.print());

    modeToggle.addEventListener('change', () => {
      document.documentElement.classList.toggle('dark', modeToggle.checked);
      localStorage.setItem(modeKey, modeToggle.checked ? 'dark' : 'light');
    });

    function restoreMode() {
      const saved = localStorage.getItem(modeKey);
      const dark = saved === 'dark';
      document.documentElement.classList.toggle('dark', dark);
      modeToggle.checked = dark;
    }

    function init() {
      restoreMode();
      render();
      if (!entryForm.date.value) {
        entryForm.date.value = new Date().toISOString().slice(0,10);
      }
    }

    init();
  </script>
</body>
</html>
